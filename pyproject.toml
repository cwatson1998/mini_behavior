[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini_behavior"
version = "1.1.0"
description = "Minimalistic gridworld reinforcement learning environments"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "Apache"}
authors = [
    {name = "Stanford & UT Austin", email = "jiahengh@utexas.edu"},
]
keywords = ["memory", "environment", "agent", "rl", "gym"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "gymnasium",
    "numpy>=1.18.0",
    "matplotlib>=3.0",
    "h5py",
]

[project.optional-dependencies]
testing = ["pytest==7.0.1"]

[project.urls]
Homepage = "https://github.com/StanfordVL/mini_behavior"

[tool.setuptools.packages.find]
include = ["mini_behavior*"] 